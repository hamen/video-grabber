<!doctype html>
<!--
  Source for docs/header.png. Regenerate after editing:
    google-chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1600,560 --screenshot=docs/header.png docs/header.html
    optipng -o5 docs/header.png
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:560px; }
  body {
    font-family: "Inter","SF Pro Display","Segoe UI",system-ui,sans-serif;
    overflow:hidden; position:relative; color:#f1f5f9;
    background:
      radial-gradient(900px 520px at 8% 0%, rgba(255,64,129,0.40), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(0,229,255,0.30), transparent 55%),
      radial-gradient(700px 500px at 60% -20%, rgba(255,171,64,0.20), transparent 60%),
      linear-gradient(135deg,#0b0b14 0%, #16101f 50%, #0a1620 100%);
  }
  /* scanlines: a nod to video */
  body::before{ content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px); }
  .wrap{ position:relative; z-index:1; height:100%; padding:60px 72px; display:flex;
         flex-direction:column; justify-content:space-between; }
  .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  h1{ font-size:132px; font-weight:800; letter-spacing:-4px; line-height:.9;
      background:linear-gradient(92deg,#ffffff 10%,#ff80ab 55%,#18ffff);
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag{ margin-top:20px; font-size:31px; font-weight:500; color:#cbd5e1; max-width:880px; line-height:1.3; }
  .mono{ font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace; }
  .cli{ margin-top:14px; white-space:nowrap; background:rgba(2,6,23,.6);
        border:1px solid rgba(148,163,184,.3); border-radius:14px; padding:18px 24px;
        font-size:25px; color:#94a3b8; }
  .cli b{ color:#f8fafc; font-weight:600; } .cli em{ color:#ff80ab; font-style:normal; }
  .row{ display:flex; align-items:center; gap:14px; }
  .src{ display:flex; flex-direction:column; gap:10px; }
  .chip{ padding:10px 20px; border-radius:999px; font-size:23px; font-weight:600; white-space:nowrap;
         background:rgba(255,255,255,.07); border:1px solid rgba(148,163,184,.28); }
  .arrow{ color:#64748b; font-size:30px; padding:0 4px; }
  .node{ display:flex; align-items:center; gap:12px; padding:18px 22px; border-radius:16px;
         font-size:25px; font-weight:600; white-space:nowrap;
         background:rgba(255,255,255,.06); border:1px solid rgba(148,163,184,.25); }
  .node .d{ width:14px; height:14px; border-radius:50%; }
  .file{ background:linear-gradient(180deg, rgba(24,255,255,.16), rgba(24,255,255,.06));
         border:1.5px solid rgba(24,255,255,.55); color:#a7ffff; }
  .local{ font-size:20px; color:#94a3b8; margin-top:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>grab</h1>
        <div class="tag">Paste a video link. Get the video and what it says, transcribed on your own machine.</div>
      </div>
      <div class="cli mono">$ <b>grab</b> <em>vm.tiktok.com/…</em></div>
    </div>

    <div class="row">
      <div class="src">
        <div class="chip">TikTok</div>
        <div class="chip">Instagram</div>
        <div class="chip">YouTube</div>
      </div>
      <span class="arrow">&rarr;</span>
      <div class="node"><span class="d" style="background:#ff4081"></span>yt&#8209;dlp</div>
      <span class="arrow">&rarr;</span>
      <div class="node"><span class="d" style="background:#ffab40"></span>audio check</div>
      <span class="arrow">&rarr;</span>
      <div>
        <div class="node"><span class="d" style="background:#69f0ae"></span>your local STT</div>
      </div>
      <span class="arrow">&rarr;</span>
      <div class="node file mono">transcript.txt</div>
    </div>
  </div>
</body>
</html>
